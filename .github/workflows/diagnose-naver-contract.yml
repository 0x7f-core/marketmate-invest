name: Diagnose Naver contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-naver-contract.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public Naver payloads
        shell: bash
        run: |
          node <<'NODE'
          const headers = {
            accept: 'application/json, text/plain, */*',
            'accept-language': 'ko-KR,ko;q=0.9,en-US;q=0.7,en;q=0.5',
            referer: 'https://stock.naver.com/',
            'user-agent': 'Mozilla/5.0 MarketMate-Contract-Check/1.0',
          };
          const shape = (value, depth = 0) => {
            if (depth > 5) return typeof value;
            if (Array.isArray(value)) return { length: value.length, sample: value.length ? shape(value[0], depth + 1) : null };
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value).slice(0, 80).map(([key, child]) => [key, shape(child, depth + 1)]));
          };
          for (const [label, path] of [
            ['US_PRICE', '/api/stockSecurity/items/v1/foreign/prices?itemCodes=AAPL.O'],
            ['US_OVER', '/api/stockSecurity/aggregate/foreignStock?type=listing&nationType=USA&size=2&index=0&sortType=tradingValue&sortDirection=desc&exchangeType=ALL&includeOverMarket=true'],
            ['KR_NEWS', '/api/domestic/detail/news?itemCode=005930&page=1&pageSize=20'],
          ]) {
            const response = await fetch(`https://stock.naver.com${path}`, { headers, redirect: 'manual' });
            const text = await response.text();
            console.log(`${label} HTTP ${response.status}`);
            if (!response.ok) continue;
            try { console.log(`${label} ${JSON.stringify(shape(JSON.parse(text)))}`); }
            catch { console.log(`${label} non-json`); }
          }
          NODE
