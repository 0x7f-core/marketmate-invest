name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - components/**
      - lib/**
      - db/**
      - drizzle/**
      - vendor/**
      - build/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - vite.config.ts
      - next.config.ts
      - .github/workflows/deploy-cloudflare.yml

# Cloudflare credentials are stored only in GitHub Actions secrets.
permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment is prepared but skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets, then run this workflow again."
          fi

      - name: Setup pnpm
        if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install
        if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Resolve production D1
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_NAME="marketmate-invest"

          resolve_id() {
            DB_JSON="$(pnpm exec wrangler d1 list --json)"
            DB_ID="$(node -e 'const xs=JSON.parse(process.argv[1]); const db=xs.find(x=>x.name===process.argv[2]); if(!db) process.exit(2); process.stdout.write(db.uuid ?? db.id ?? "")' "$DB_JSON" "$DB_NAME")"
            if [ -z "$DB_ID" ]; then
              echo "Could not resolve D1 database id for $DB_NAME" >&2
              exit 1
            fi
            printf '%s' "$DB_ID"
          }

          DB_ID="$(resolve_id)"
          echo "MARKETMATE_DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Validate
        if: steps.credentials.outputs.ready == 'true'
        run: pnpm run validate:migration

      - name: Build production Worker
        if: steps.credentials.outputs.ready == 'true'
        run: pnpm run build

      - name: Apply D1 migrations
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply marketmate-invest --remote

      - name: Deploy Worker
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Record production smoke window
        if: steps.credentials.outputs.ready == 'true'
        run: echo "PRODUCTION_SMOKE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Smoke live production API and Naver routes
        if: steps.credentials.outputs.ready == 'true'
        env:
          APP_BASE_URL: https://marketmate-invest.0x7f-core.workers.dev
        run: pnpm run validate:runtime

      - name: Show Chrome version
        if: steps.credentials.outputs.ready == 'true'
        run: google-chrome --version

      - name: Smoke live production desktop/mobile browser
        if: steps.credentials.outputs.ready == 'true'
        env:
          APP_BASE_URL: https://marketmate-invest.0x7f-core.workers.dev
        run: pnpm run validate:browser

      - name: Cleanup production smoke data
        if: always() && steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${PRODUCTION_SMOKE_STARTED_AT:-}" ]; then
            node scripts/cleanup-production-smoke.mjs || true
          fi

      - name: Upload production browser screenshots
        if: always() && steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke
          path: artifacts/browser-smoke
          if-no-files-found: ignore
