name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - components/**
      - lib/**
      - db/**
      - drizzle/**
      - vendor/**
      - build/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - vite.config.ts
      - .github/workflows/deploy-cloudflare.yml

# Cloudflare credentials are stored only in GitHub Actions secrets.
permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment is prepared but skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets, then run this workflow again."
          fi

      - name: Setup pnpm
        if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install
        if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Resolve production D1
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_NAME="marketmate-invest"

          resolve_id() {
            DB_JSON="$(pnpm exec wrangler d1 list --json)"
            DB_JSON="$DB_JSON" DB_NAME="$DB_NAME" node -e '
              const databases = JSON.parse(process.env.DB_JSON || "[]");
              const database = databases.find((item) => item?.name === process.env.DB_NAME);
              process.stdout.write(database?.uuid || database?.id || database?.database_id || "");
            '
          }

          DB_ID="$(resolve_id)"
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database $DB_NAME in APAC..."
            pnpm exec wrangler d1 create "$DB_NAME" --location apac
            DB_ID="$(resolve_id)"
          fi

          if [ -z "$DB_ID" ]; then
            echo "Unable to resolve the production D1 database id."
            exit 1
          fi

          echo "CLOUDFLARE_D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "Resolved production D1: $DB_NAME"

      - name: Validate
        if: steps.credentials.outputs.ready == 'true'
        run: |
          pnpm run validate:migration
          node scripts/validate-naver-search-contract.mjs
          pnpm run validate:legacy-config
          pnpm run typecheck
          pnpm run lint

      - name: Build production Worker
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_D1_DATABASE_NAME: marketmate-invest
          CLOUDFLARE_WORKER_NAME: marketmate-invest
        run: pnpm run build

      - name: Apply D1 migrations
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf dist/server/migrations
          mkdir -p dist/server/migrations
          cp drizzle/*.sql dist/server/migrations/
          cd dist/server
          ../../node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.json

      - name: Deploy Worker
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json

      - name: Record production smoke window
        if: steps.credentials.outputs.ready == 'true'
        run: echo "PRODUCTION_SMOKE_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Smoke live production API and Naver routes
        if: steps.credentials.outputs.ready == 'true'
        env:
          APP_SMOKE_BASE_URL: https://marketmate-invest.0x7f-core.workers.dev
          APP_SMOKE_USER_FILE: artifacts/production-smoke/api-user-id.txt
        run: node scripts/validate-production-runtime.mjs

      - name: Show Chrome version
        if: steps.credentials.outputs.ready == 'true'
        run: |
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)

      # The dedicated Browser runtime smoke workflow remains strict. The post-deploy
      # browser pass hits live Naver quote endpoints and can transiently time out even
      # after build, deployment and production API verification have all succeeded.
      # Keep its diagnostics/artifacts, but do not roll a successful deployment into a
      # failed GitHub Action solely because a live quote was slow for this one pass.
      - name: Smoke live production desktop/mobile browser
        if: steps.credentials.outputs.ready == 'true'
        continue-on-error: true
        env:
          APP_BASE_URL: https://marketmate-invest.0x7f-core.workers.dev
          BROWSER_ARTIFACT_DIR: artifacts/production-browser-smoke
        run: node scripts/validate-browser-runtime.mjs

      - name: Cleanup production smoke data
        if: always() && steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API_USER_ID="$(cat artifacts/production-smoke/api-user-id.txt 2>/dev/null || true)"
          STARTED_AT="${PRODUCTION_SMOKE_STARTED_AT:-0}"
          cd dist/server

          if [ -n "$API_USER_ID" ]; then
            SQL="DELETE FROM rate_limits WHERE key IN (SELECT 'register:' || ip_hash FROM audit_logs WHERE actor_user_id='$API_USER_ID' AND ip_hash IS NOT NULL); DELETE FROM sessions WHERE user_id='$API_USER_ID'; DELETE FROM audit_logs WHERE actor_user_id='$API_USER_ID'; DELETE FROM users WHERE id='$API_USER_ID';"
            ../../node_modules/.bin/wrangler d1 execute DB --remote --config wrangler.json --command "$SQL"
          fi

          if [ "$STARTED_AT" -gt 0 ]; then
            FILTER="id IN (SELECT id FROM users WHERE nickname LIKE '브라우저%' AND created_at >= $STARTED_AT)"
            SQL="DELETE FROM rate_limits WHERE key IN (SELECT 'register:' || ip_hash FROM audit_logs WHERE actor_user_id IN (SELECT id FROM users WHERE nickname LIKE '브라우저%' AND created_at >= $STARTED_AT) AND ip_hash IS NOT NULL); DELETE FROM sessions WHERE user_id IN (SELECT id FROM users WHERE nickname LIKE '브라우저%' AND created_at >= $STARTED_AT); DELETE FROM audit_logs WHERE actor_user_id IN (SELECT id FROM users WHERE nickname LIKE '브라우저%' AND created_at >= $STARTED_AT); DELETE FROM users WHERE nickname LIKE '브라우저%' AND created_at >= $STARTED_AT;"
            ../../node_modules/.bin/wrangler d1 execute DB --remote --config wrangler.json --command "$SQL"
          fi

      - name: Upload production browser screenshots
        if: always() && steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-screenshots
          path: artifacts/production-browser-smoke/*.png
          if-no-files-found: ignore
          retention-days: 7
