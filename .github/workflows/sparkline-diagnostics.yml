name: Sparkline diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sparkline-diagnostics.yml'
      - 'app/api/market-sparklines/route.ts'
      - 'app/home-index-board.tsx'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production sparkline payload
        env:
          URL: https://marketmate-invest.0x7f-core.workers.dev/api/market-sparklines
        run: |
          node - <<'NODE'
          const response = await fetch(process.env.URL, { cache: 'no-store' });
          const payload = await response.json();
          for (const id of ['KOSPI','KOSDAQ','SPX','COMP','BTC','USDKRW']) {
            const item = payload?.series?.[id] ?? {};
            const points = Array.isArray(item.points) ? item.points : [];
            const unique = new Set(points.map(p => Number(p?.value).toFixed(8))).size;
            console.log(`SPARK ${id} points=${points.length} unique=${unique} stale=${Boolean(item.stale)}`);
          }
          NODE

      - name: Probe Bitcoin marketInfo endpoint
        run: |
          node - <<'NODE'
          const base='https://stock.naver.com';
          const now=Date.now();
          const local=(timestamp)=>{
            const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(timestamp));
            const p=t=>parts.find(x=>x.type===t)?.value||'';
            return `${p('year')}-${p('month')}-${p('day')}T${p('hour')}:${p('minute')}:${p('second')}`;
          };
          const from=local(now-26*3600000);
          const to=local(now+300000);
          for(const suffix of ['marketInfo','']){
            const path=`/api/coin/candle/UPBIT/KRW/BTC/minutes/5${suffix?'/'+suffix:''}?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
            const r=await fetch(base+path,{headers:{accept:'application/json, text/plain, */*','accept-language':'ko-KR,ko;q=0.9','user-agent':'Mozilla/5.0','referer':'https://stock.naver.com/'}});
            const text=await r.text();
            console.log(`BTC_${suffix||'DETAIL'} HTTP=${r.status} bytes=${text.length}`);
            console.log(text.slice(0,6000));
          }
          NODE
