name: Naver market data refactor

on:
  push:
    branches:
      - refactor/naver-market-data

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Enable pnpm
        run: corepack enable
      - name: Apply UI and API migration
        run: node scripts/apply-naver-market-ui-refactor.mjs
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm run build
      - name: Remove one-time migration files
        run: |
          rm scripts/apply-naver-market-ui-refactor.mjs
          rm .github/workflows/naver-market-refactor.yml
      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete Naver market data migration"
            git push origin HEAD:refactor/naver-market-data
          fi
