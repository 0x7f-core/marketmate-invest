name: Probe US logos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-us-logos.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Naver US stock and ETF logo metadata
        run: |
          node <<'NODE'
          const headers = { 'user-agent': 'Mozilla/5.0', referer: 'https://stock.naver.com/' };
          const tickers = ['AAPL','MSFT','NVDA','TSLA','AMZN','META','GOOGL','AVGO','AMD','GEV','PLTR','NFLX','SPY','QQQ','SOXL','IWM','SOXX','VOO','SOXS','TQQQ','GLD','DIA','IVV','ARKK','VTI','SCHD','XLK','XLE','SMH'];
          const suffixes = ['', '.O', '.N', '.P', '.K', '.A'];
          async function fetchText(url) {
            try {
              const r = await fetch(url, { headers });
              return { status:r.status, text:await r.text() };
            } catch (e) { return { status:0, text:String(e) }; }
          }
          for (const ticker of tickers) {
            const auto = await fetchText(`https://stock.naver.com/api/autocomplete/search/autoComplete?query=${encodeURIComponent(ticker)}&target=stock`);
            let items=[];
            try { items = JSON.parse(auto.text)?.result?.items ?? []; } catch {}
            const picked = items.filter(x => x && (String(x.code||'').toUpperCase()===ticker || String(x.reutersCode||'').toUpperCase().startsWith(ticker))).slice(0,5);
            console.log('AUTO', ticker, auto.status, JSON.stringify(picked.map(x=>({code:x.code,reutersCode:x.reutersCode,name:x.name,typeCode:x.typeCode,nationCode:x.nationCode,url:x.url}))));
            const candidates = [...new Set([ticker, ...picked.flatMap(x=>[x.reutersCode,x.code]).filter(Boolean), ...suffixes.map(s=>ticker+s)])];
            for (const code of candidates) {
              const out = await fetchText(`https://stock.naver.com/api/securityService/stock/${encodeURIComponent(code)}/basic`);
              if (out.status !== 200) continue;
              let data={}; try { data=JSON.parse(out.text); } catch {}
              console.log('BASIC', ticker, code, out.status, JSON.stringify({reutersCode:data.reutersCode,stockName:data.stockName,stockEndType:data.stockEndType,itemLogoUrl:data.itemLogoUrl,itemLogoPngUrl:data.itemLogoPngUrl,isEtf:data.isEtf,isEtfAmerica:data.isEtfAmerica}));
            }
          }
          for (const url of [
            'https://stock.naver.com/api/foreign/market/etf/usa?orderType=marketValue&largeCode=all&middleCode=all&startIdx=0&pageSize=50',
            'https://stock.naver.com/api/foreign/market/home/notableETF?orderType=marketValue&largeCode=all&middleCode=all&startIdx=0&pageSize=50'
          ]) {
            const out = await fetchText(url);
            console.log('ETF_LIST', out.status, url, out.text.slice(0,12000));
          }
          NODE