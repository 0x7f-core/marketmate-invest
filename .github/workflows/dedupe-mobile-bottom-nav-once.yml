name: One-time mobile bottom nav dedupe

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make mobile bottom navigation single-source and unique
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/trading-dashboard.tsx')
          text = path.read_text()

          nav_line = '  const nav:(readonly[AppView,string])[]=[["home","홈"],["market","시세"],["watchlist","관심"],["competition","모의투자대회"],["news","뉴스"],["portfolio","MY"]];\n'
          mobile_const = '  const mobileNavItems = [["home",Home,"홈"],["watchlist",Star,"관심"],["market",LineChart,"시세"],["competition",Trophy,"대회"],["news",Newspaper,"뉴스"],["portfolio",WalletCards,"MY"]] as const;\n'

          if 'const mobileNavItems =' not in text:
              if nav_line not in text:
                  raise SystemExit('desktop nav anchor not found')
              text = text.replace(nav_line, nav_line + mobile_const, 1)

          old = '<nav className="np-mobile-bottom">{[["home",Home,"홈"],["watchlist",Star,"관심"],["market",LineChart,"시세"],["competition",Trophy,"대회"],["news",Newspaper,"뉴스"],["portfolio",WalletCards,"MY"]].map(([key,Icon,label])=>{const I=Icon as typeof Home;return <button key={String(key)} className={view===key?"active":""} onClick={()=>key==="market"?openMarketView():setView(key as AppView)}><I/><span>{String(label)}</span></button>})}</nav>'
          new = '<nav className="np-mobile-bottom">{mobileNavItems.map(([key,Icon,label])=>{const I=Icon as typeof Home;return <button key={key} className={view===key?"active":""} onClick={()=>key==="market"?openMarketView():setView(key as AppView)}><I/><span>{label}</span></button>})}</nav>'

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('mobile bottom nav render block not found')

          path.write_text(text)
          PY
      - name: Commit mobile navigation fix
        run: |
          rm .github/workflows/dedupe-mobile-bottom-nav-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/trading-dashboard.tsx .github/workflows/dedupe-mobile-bottom-nav-once.yml
          git commit -m "fix: deduplicate mobile bottom navigation"
          git push
