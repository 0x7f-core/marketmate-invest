name: Fix crypto chart runtime contract

on:
  push:
    branches:
      - refactor/naver-market-data
    paths:
      - .github/workflows/fix-crypto-chart-runtime.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/naver-market-data

      - name: Patch crypto candle datetime contract
        run: |
          python - <<'PY'
          from pathlib import Path

          market = Path('lib/server/market-data.ts')
          text = market.read_text()
          old = '''    const ticker = cryptoTicker(symbol);\n    const to = new Date();\n    const from = new Date(Date.now() - days * 86_400_000);\n    result = await naverJson<unknown>(buildNaverPath(`/api/coin/candle/UPBIT/KRW/${encodeURIComponent(ticker)}/days`, { from: from.toISOString(), to: to.toISOString() }), { ttlMs: 30_000, staleMs: 15 * 60_000 });'''
          new = '''    const ticker = cryptoTicker(symbol);\n    const to = Date.now();\n    const from = to - days * 86_400_000;\n    const kstLocalIso = (value: number) => new Date(value + 9 * 60 * 60_000).toISOString().slice(0, 19);\n    result = await naverJson<unknown>(buildNaverPath(`/api/coin/candle/UPBIT/KRW/${encodeURIComponent(ticker)}/days`, { from: kstLocalIso(from), to: kstLocalIso(to) }), { ttlMs: 30_000, staleMs: 15 * 60_000 });'''
          if old not in text:
              raise SystemExit('market-data crypto chart snippet not found')
          market.write_text(text.replace(old, new))

          smoke = Path('scripts/validate-naver-runtime.mjs')
          text = smoke.read_text()
          old = '''const now = new Date();\nconst from = new Date(Date.now() - 8 * 86_400_000);'''
          new = '''const toMs = Date.now();\nconst fromMs = toMs - 8 * 86_400_000;\nconst kstLocalIso = value => new Date(value + 9 * 60 * 60_000).toISOString().slice(0, 19);'''
          if old not in text:
              raise SystemExit('runtime smoke datetime snippet not found')
          text = text.replace(old, new)
          old = '''    path: `/api/coin/candle/UPBIT/KRW/BTC/days?from=${encodeURIComponent(from.toISOString())}&to=${encodeURIComponent(now.toISOString())}`,'''
          new = '''    path: `/api/coin/candle/UPBIT/KRW/BTC/days?from=${encodeURIComponent(kstLocalIso(fromMs))}&to=${encodeURIComponent(kstLocalIso(toMs))}`,'''
          if old not in text:
              raise SystemExit('runtime smoke crypto path snippet not found')
          smoke.write_text(text.replace(old, new))
          PY

      - name: Commit runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/server/market-data.ts scripts/validate-naver-runtime.mjs
          git commit -m "Fix Naver crypto candle datetime contract"
          git push origin HEAD:refactor/naver-market-data
