name: Patch last viewed instrument

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-last-viewed-instrument.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply patch
        run: python scripts/patch-last-viewed-instrument.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/trading-dashboard.tsx
          git diff --cached --check
          git commit -m "Remember last viewed market instruments"
          git push origin HEAD:main
