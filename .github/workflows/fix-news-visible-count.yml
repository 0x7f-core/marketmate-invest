name: One-time visible news count fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-news-visible-count.yml"

permissions:
  contents: write

jobs:
  fix-news-count:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix displayed news count and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/trading-dashboard.tsx")
          text = path.read_text(encoding="utf-8")
          old = '<span>{sorted.length?`${sorted.length}건 · 최신순`:""}</span>'
          new = '<span>{sorted.length?`${Math.min(sorted.length,10)}건 · 최신순`:""}</span>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one target, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/fix-news-visible-count.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/trading-dashboard.tsx .github/workflows/fix-news-visible-count.yml
          git commit -m "fix: show visible news count"
          git push origin HEAD:main
