name: Ranking parity diagnostics
on:
  push:
    paths:
      - .github/workflows/ranking-parity-diagnostics.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -u
          for listing in changeRateDescUpAll changeRateDescDownAll marketCapDesc; do
            for exchange in krx nxt; do
              echo "===== $listing / $exchange ====="
              url="https://stock.naver.com/api/stockSecurity/individual-stocks/v3/domestic?listingType=$listing&exchangeType=$exchange&index=0&size=5"
              code=$(curl -sS --max-time 15 -o /tmp/b -w '%{http_code}' -H 'accept: application/json, text/plain, */*' -H 'referer: https://stock.naver.com/' -A 'Mozilla/5.0 MarketMate-Parity-Diagnostic/1.0' "$url" || true)
              echo "HTTP $code"
              head -c 7000 /tmp/b || true
              echo
            done
          done
          echo "===== market status ====="
          curl -sS --max-time 15 -H 'accept: application/json, text/plain, */*' -H 'referer: https://stock.naver.com/' -A 'Mozilla/5.0 MarketMate-Parity-Diagnostic/1.0' 'https://stock.naver.com/api/stockSecurity/market-status/current?exchanges=krx&exchanges=nxt' | head -c 10000
          echo
