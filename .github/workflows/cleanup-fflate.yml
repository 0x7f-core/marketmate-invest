name: Cleanup unused direct dependency

on:
  push:
    branches:
      - refactor/naver-market-data
    paths:
      - .github/workflows/cleanup-fflate.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/naver-market-data

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Remove obsolete direct fflate dependency
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package.json';
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          if (pkg.dependencies?.fflate) delete pkg.dependencies.fflate;
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm install --lockfile-only --ignore-scripts

      - name: Commit regenerated package metadata
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "No dependency cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "Remove obsolete direct fflate dependency"
          git push origin HEAD:refactor/naver-market-data
