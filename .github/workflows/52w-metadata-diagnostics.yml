name: 52w metadata diagnostics
on:
  push:
    paths:
      - .github/workflows/52w-metadata-diagnostics.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          for url in             'https://stock.naver.com/api/securityService/chart/domestic/item/005930?periodType=day&stockExchangeType=NXT'             'https://stock.naver.com/api/securityService/chart/domestic/item/005930?periodType=day&tradeType=NXT'             'https://stock.naver.com/api/securityService/chart/domestic/item/005930?periodType=day&exchangeType=NXT'             'https://api.stock.naver.com/chart/domestic/item/005930?periodType=dayCandle&stockExchangeType=NXT'             'https://api.stock.naver.com/chart/domestic/item/005930?periodType=dayCandle&tradeType=NXT'             'https://api.stock.naver.com/chart/domestic/item/005930?periodType=dayCandle&exchangeType=NXT'
          do
            echo "===== $url ====="
            code=$(curl -sS --max-time 25 -o /tmp/b -w '%{http_code}' -H 'accept: application/json,*/*' -H 'referer: https://stock.naver.com/' -A 'Mozilla/5.0' "$url" || true)
            echo "HTTP $code"
            head -c 1200 /tmp/b || true
            echo
          done
