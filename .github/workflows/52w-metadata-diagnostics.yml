name: 52w metadata diagnostics
on:
  push:
    paths:
      - .github/workflows/52w-metadata-diagnostics.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 30 -A 'Mozilla/5.0' 'https://stock.naver.com/domestic/stock/005930/price' -o /tmp/page
          grep -oE 'src="[^"]+\.js[^"]*"' /tmp/page | sed 's/^src="//;s/"$//' | sort -u > /tmp/srcs
          count=0
          while IFS= read -r src; do
            case "$src" in
              http*) url="$src" ;;
              /*) url="https://stock.naver.com$src" ;;
              *) continue ;;
            esac
            out="/tmp/chunk_$count.js"
            curl -sS --max-time 20 -A 'Mozilla/5.0' "$url" -o "$out" || true
            if grep -Eq 'daily-prices|price-snapshot|integratedPriceInfo|highPriceOf52Weeks|stockExchangeType.*NXT|exchangeType.*NXT|codeType.*NXT' "$out"; then
              echo "===== MATCH $url ====="
              grep -oE '.{0,350}(daily-prices|price-snapshot|integratedPriceInfo|highPriceOf52Weeks|exchangeType.?[:=].?["'\'' ]?NXT|codeType.?[:=].?["'\'' ]?NXT).{0,900}' "$out" | head -40 || true
            fi
            count=$((count+1))
          done < /tmp/srcs
