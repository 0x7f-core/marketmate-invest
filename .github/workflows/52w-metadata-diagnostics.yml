name: 52w metadata diagnostics
on:
  push:
    paths:
      - .github/workflows/52w-metadata-diagnostics.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          for url in             'https://stock.naver.com/api/stockSecurity/items/v2/domestic/prices?itemCodes=005930&recurring=false'             'https://stock.naver.com/api/stockSecurity/items/v2/domestic/prices?itemCodes=005930&recurring=true'             'https://stock.naver.com/api/stockSecurity/items/v2/domestic/005930/price-snapshot'
          do
            echo "===== $url ====="
            curl -sS --max-time 25 -H 'accept: application/json,*/*' -H 'referer: https://stock.naver.com/' -A 'Mozilla/5.0' "$url"
            echo
          done
