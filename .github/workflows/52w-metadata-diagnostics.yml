name: 52w metadata diagnostics
on:
  push:
    paths:
      - .github/workflows/52w-metadata-diagnostics.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          probe() {
            echo "===== $1 ====="
            code=$(curl -sS --max-time 25 -o /tmp/b -w '%{http_code}' -H 'accept: application/json,*/*' -H 'referer: https://m.stock.naver.com/' -A 'Mozilla/5.0' "$2" || true)
            echo "HTTP $code"
            head -c 50000 /tmp/b || true
            echo
          }
          probe integration 'https://m.stock.naver.com/front-api/stock/domestic/integration?code=005930&endType=stock'
          probe basic 'https://m.stock.naver.com/front-api/stock/domestic/basic?code=005930&endType=stock'
