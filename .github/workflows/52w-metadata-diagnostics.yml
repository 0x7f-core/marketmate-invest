name: 52w metadata diagnostics
on:
  push:
    paths:
      - .github/workflows/52w-metadata-diagnostics.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          for url in             'https://stock.naver.com/api/securityService/chart/domestic/item/005930?periodType=dayCandle&startDateTime=20250918&endDateTime=20260918'             'https://api.stock.naver.com/chart/domestic/item/005930?periodType=dayCandle&startDateTime=20250918&endDateTime=20260918'
          do
            echo "===== $url ====="
            curl -sS --max-time 25 -H 'accept: application/json,*/*' -H 'referer: https://stock.naver.com/' -A 'Mozilla/5.0' "$url" -o /tmp/b
            python3 - <<'PY'
          import json
          j=json.load(open('/tmp/b'))
          rows=j.get('priceInfos',[]) if isinstance(j,dict) else []
          print('rows',len(rows),'first',rows[0] if rows else None,'last',rows[-1] if rows else None)
          PY
          done
