name: 52w metadata diagnostics
on:
  push:
    paths:
      - .github/workflows/52w-metadata-diagnostics.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          for url in             'https://m.stock.naver.com/front-api/stock/domestic/integration?code=005930&endType=stock'             'https://m.stock.naver.com/front-api/stock/domestic/basic?code=005930&endType=stock'
          do
            echo "===== $url ====="
            code=$(curl -sS --max-time 25 -o /tmp/b -w '%{http_code}' -H 'accept: application/json,*/*' -H 'referer: https://m.stock.naver.com/' -A 'Mozilla/5.0' "$url" || true)
            echo "HTTP $code"
            python3 - <<'PY'
import json
try:
    data=json.load(open('/tmp/b'))
    print(json.dumps(data,ensure_ascii=False)[:50000])
except Exception:
    print(open('/tmp/b',encoding='utf-8',errors='ignore').read()[:50000])
PY
            echo
          done
