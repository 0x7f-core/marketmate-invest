name: 52w metadata diagnostics
on:
  push:
    paths:
      - .github/workflows/52w-metadata-diagnostics.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 30 -H 'accept: text/html,*/*' -A 'Mozilla/5.0' 'https://stock.naver.com/domestic/stock/005930' -o /tmp/page
          echo '===== page matches ====='
          python3 - <<'PY'
          text=open('/tmp/page',encoding='utf-8',errors='ignore').read()
          for needle in ['52주 최고','highPriceOf52Weeks','week52HighPrice','380000','374500']:
              print('\n--',needle,'--')
              start=0
              found=0
              while found<8:
                  i=text.find(needle,start)
                  if i<0: break
                  print(text[max(0,i-400):i+900])
                  start=i+len(needle)
                  found+=1
          PY
