name: 52w metadata diagnostics
on:
  push:
    paths:
      - .github/workflows/52w-metadata-diagnostics.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 25 -A 'Mozilla/5.0' 'https://stock.naver.com/domestic/stock/005930' -o /tmp/page
          python3 - <<'PY' > /tmp/scripts
          import re
          t=open('/tmp/page',encoding='utf-8',errors='ignore').read()
          for u in dict.fromkeys(re.findall(r'<script[^>]+src="([^"]+\.js[^"]*)"',t)):
              if u.startswith('/'): u='https://stock.naver.com'+u
              print(u.replace('&amp;','&'))
          PY
          echo "scripts $(wc -l </tmp/scripts)"
          n=0
          while IFS= read -r url; do
            n=$((n+1))
            curl -sS --max-time 15 -A 'Mozilla/5.0' "$url" -o /tmp/chunk || continue
            if grep -Eq 'NXT|nxt' /tmp/chunk && grep -Eq 'chart|Chart' /tmp/chunk; then
              echo "===== MATCH $n $url ====="
              python3 - <<'PY'
          import re
          t=open('/tmp/chunk',encoding='utf-8',errors='ignore').read()
          for needle in ['NXT','stockExchangeType','exchangeType','tradeType','codeType','chart/domestic','securityService/chart']:
              for m in list(re.finditer(needle,t))[:8]:
                  i=m.start()
                  print('\n--',needle,'--\n',t[max(0,i-700):i+1300])
          PY
            fi
          done < /tmp/scripts
