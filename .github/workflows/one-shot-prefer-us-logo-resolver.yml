name: One-shot prefer US logo resolver

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-prefer-us-logo-resolver.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prefer Naver metadata logo resolver for US instruments
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('app/trading-dashboard.tsx')
          text = path.read_text()
          old = 'return[...new Set([`${NAVER_STOCK_LOGO_BASE}Stock${code}.svg`,resolver])];'
          new = 'return[...new Set([resolver,`${NAVER_STOCK_LOGO_BASE}Stock${code}.svg`])];'
          if old not in text:
              raise SystemExit('US logo candidate ordering snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/trading-dashboard.tsx
          git diff --cached --check
          git commit -m "Prefer Naver metadata logos for US instruments"
          git push origin HEAD:main
