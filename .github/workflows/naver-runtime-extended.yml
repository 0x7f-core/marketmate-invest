name: Naver runtime extended

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/naver-market-data
    paths:
      - scripts/validate-naver-runtime-extended.mjs
      - .github/workflows/naver-runtime-extended.yml

permissions:
  contents: read

concurrency:
  group: naver-runtime-extended
  cancel-in-progress: true

jobs:
  extended-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Validate extended live Naver Stock endpoints
        run: node scripts/validate-naver-runtime-extended.mjs
