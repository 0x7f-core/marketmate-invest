name: Validate Naver migration

on:
  push:
    branches:
      - main
      - refactor/naver-market-data
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: validate:migration
        run: pnpm run validate:migration

      - name: validate:search-contract
        run: node scripts/validate-naver-search-contract.mjs

      - name: validate:legacy-config
        run: pnpm run validate:legacy-config

      - name: typecheck
        run: pnpm run typecheck

      - name: lint
        run: pnpm run lint

      - name: build
        run: pnpm run build
