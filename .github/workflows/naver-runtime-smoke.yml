name: Naver runtime smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/validate-naver-runtime.mjs
      - .github/workflows/naver-runtime-smoke.yml
  schedule:
    - cron: "20 0 * * 1-5"

permissions:
  contents: read

concurrency:
  group: naver-runtime-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Validate live Naver Stock endpoints
        run: node scripts/validate-naver-runtime.mjs

      - name: Probe US ETF logo metadata
        run: |
          node <<'NODE'
          const headers = { 'user-agent': 'Mozilla/5.0', referer: 'https://stock.naver.com/' };
          const urls = [
            'https://stock.naver.com/api/securityService/stock/QQQ.O/basic',
            'https://stock.naver.com/api/securityService/stock/SPY/basic',
            'https://stock.naver.com/api/securityService/stock/TQQQ.O/basic',
            'https://stock.naver.com/api/securityService/stock/VOO/basic',
            'https://stock.naver.com/api/securityService/stock/IVV.P/basic',
          ];
          for (const url of urls) {
            const response = await fetch(url, { headers });
            const text = await response.text();
            let out = text;
            try {
              const data = JSON.parse(text);
              out = JSON.stringify({
                reutersCode:data.reutersCode,
                stockName:data.stockName,
                stockEndType:data.stockEndType,
                itemLogoUrl:data.itemLogoUrl,
                itemLogoPngUrl:data.itemLogoPngUrl,
                isEtf:data.isEtf,
                isEtfAmerica:data.isEtfAmerica,
              });
            } catch {}
            console.log('ETF_LOGO_META', response.status, url, out.slice(0, 4000));
          }

          const pageUrl = 'https://stock.naver.com/market/stock/usa/stocklist/priceTop';
          const html = await (await fetch(pageUrl, { headers })).text();
          const scripts = [...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(match => new URL(match[1], pageUrl).href);
          for (const script of scripts) {
            try {
              const js = await (await fetch(script, { headers })).text();
              const index = js.indexOf('46657:');
              if (index >= 0) console.log('ETF_LOGO_HELPER', script, js.slice(index, index + 18000));
            } catch {}
          }
          NODE
