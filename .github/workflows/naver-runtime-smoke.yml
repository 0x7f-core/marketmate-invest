name: Naver runtime smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/validate-naver-runtime.mjs
      - .github/workflows/naver-runtime-smoke.yml
  schedule:
    - cron: "20 0 * * 1-5"

permissions:
  contents: read

concurrency:
  group: naver-runtime-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Validate live Naver Stock endpoints
        run: node scripts/validate-naver-runtime.mjs

      - name: Diagnose live US logo assets
        run: |
          node <<'NODE'
          const urls = [
            'https://ssl.pstatic.net/imgstock/fn/real/logo/stock/StockQQQ.svg',
            'https://ssl.pstatic.net/imgstock/fn/real/logo/stock/StockQQQ.O.svg',
            'https://ssl.pstatic.net/imgstock/fn/real/logo/stock/StockQQQD.svg',
            'https://ssl.pstatic.net/imgstock/fn/real/logo/stock/StockQQQD.K.svg',
            'https://ssl.pstatic.net/imgstock/fn/real/logo/stock/StockSOXL.svg',
            'https://ssl.pstatic.net/imgstock/fn/real/logo/stock/StockSOXL.O.svg',
            'https://ssl.pstatic.net/imgstock/fn/real/logo/stock/StockSPY.svg',
            'https://ssl.pstatic.net/imgstock/fn/real/logo/stock/StockSPY.P.svg',
            'https://ssl.pstatic.net/imgstock/fn/real/logo/stock/StockGEV.svg',
            'https://ssl.pstatic.net/imgstock/fn/real/logo/stock/StockGEV.N.svg',
          ];
          for (const url of urls) {
            try {
              const response = await fetch(url, { headers: { 'user-agent':'Mozilla/5.0', referer:'https://stock.naver.com/' }, redirect:'manual' });
              const body = await response.text();
              console.log('LOGO_ASSET', response.status, response.headers.get('content-type'), body.length, url, body.slice(0, 260).replace(/\s+/g,' '));
            } catch (error) {
              console.log('LOGO_ASSET_ERROR', url, String(error));
            }
          }

          const page = await fetch('https://stock.naver.com/market/stock/usa/stocklist/priceTop', { headers: { 'user-agent':'Mozilla/5.0' } });
          const html = await page.text();
          const scripts = [...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(match => new URL(match[1], 'https://stock.naver.com').href);
          console.log('PAGE_SCRIPTS', scripts.length);
          for (const script of scripts) {
            try {
              const js = await (await fetch(script, { headers: { 'user-agent':'Mozilla/5.0', referer:'https://stock.naver.com/' } })).text();
              const hits = [];
              for (const token of ['thumbnailItemCode', 'imgstock/fn/real/logo', '/logo/stock/', 'Stock.svg', 'stock/Stock']) {
                let from = 0;
                while (true) {
                  const i = js.indexOf(token, from);
                  if (i < 0) break;
                  hits.push(js.slice(Math.max(0,i-600), i+1000));
                  from = i + token.length;
                  if (hits.length >= 8) break;
                }
              }
              if (hits.length) console.log('JS_LOGO_MATCH', script, hits.join('\n---\n').slice(0,16000));
            } catch {}
          }
          NODE
