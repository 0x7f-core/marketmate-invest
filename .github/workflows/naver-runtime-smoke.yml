name: Naver runtime smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/validate-naver-runtime.mjs
      - .github/workflows/naver-runtime-smoke.yml
  schedule:
    - cron: "20 0 * * 1-5"

permissions:
  contents: write

concurrency:
  group: naver-runtime-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch malformed Naver logo URL builder
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/trading-dashboard.tsx')
          source = path.read_text()
          old = '''function instrumentLogoUrl(instrument:Pick<Instrument,"market"|"symbol"|"exchange">){if(instrument.market==="KR")return `https://ssl.pstatic.net/imgstock/fn/real/logo/stock/Stock${instrument.symbol}.svg`;if(instrument.market==="CRYPTO")return "/favicon.svg";const suffix=instrument.exchange==="NYS"?"K":instrument.exchange==="AMS"?"A":"O";return `https://ssl.pstatic.net/imgstock/fn/real/logo/stock/Stock${instrument.symbol.replace("_", ".")}.${suffix}.svg`;}
          function InstrumentLogo({instrument,size="md"}:{instrument:Pick<Instrument,"market"|"symbol"|"exchange"|"name">;size?:"sm"|"md"|"lg"}){const[failed,setFailed]=useState(false);return <span className={`instrument-logo ${size}`}>{failed?instrument.name.slice(0,1):<img src={instrumentLogoUrl(instrument)} alt={`${instrument.name} 로고`} onError={()=>setFailed(true)}/>}</span>;}'''
          new = '''const NAVER_STOCK_LOGO_BASE="https://ssl.pstatic.net/imgstock/fn/real/logo/stock/";
          function normalizeNaverLogoCode(symbol:string){let clean=String(symbol??"").trim().replaceAll("\\\\","/");const tail=clean.split("/").filter(Boolean).pop()??"";clean=tail.replace(/\\.svg$/i,"").replace(/^(?:Stock)+/i,"");return clean.replace(/[^A-Za-z0-9._-]/g,"");}
          function instrumentLogoCandidates(instrument:Pick<Instrument,"market"|"symbol"|"exchange">){if(instrument.market==="CRYPTO")return["/favicon.svg"];const code=normalizeNaverLogoCode(instrument.symbol);if(!code)return[];const urls=[`${NAVER_STOCK_LOGO_BASE}Stock${code}.svg`];if(instrument.market==="US"){const ticker=code.replace(/\\.[A-Za-z]$/,"");if(ticker&&ticker!==code)urls.push(`${NAVER_STOCK_LOGO_BASE}Stock${ticker}.svg`);}return[...new Set(urls)];}
          function InstrumentLogo({instrument,size="md"}:{instrument:Pick<Instrument,"market"|"symbol"|"exchange"|"name">;size?:"sm"|"md"|"lg"}){const[attempt,setAttempt]=useState(0);useEffect(()=>setAttempt(0),[instrument.market,instrument.symbol]);const candidates=instrumentLogoCandidates(instrument);const src=candidates[attempt];const failed=!src;return <span className={`instrument-logo ${size}`}>{failed?instrument.name.slice(0,1):<img src={src} alt={`${instrument.name} 로고`} onError={()=>setAttempt(value=>value+1)}/>}</span>;}'''
          if old not in source:
              raise SystemExit('Expected logo builder block was not found; refusing an unsafe patch.')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git diff -- app/trading-dashboard.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/trading-dashboard.tsx
          git commit -m "Fix recursive Naver stock logo paths"
          git push origin HEAD:main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Validate live Naver Stock endpoints
        run: node scripts/validate-naver-runtime.mjs
