name: Naver runtime smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/validate-naver-runtime.mjs
      - .github/workflows/naver-runtime-smoke.yml
  schedule:
    - cron: "20 0 * * 1-5"

permissions:
  contents: read

concurrency:
  group: naver-runtime-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Validate live Naver Stock endpoints
        run: node scripts/validate-naver-runtime.mjs

      - name: Diagnose live crypto logo sources
        run: |
          node <<'NODE'
          const headers = { 'user-agent': 'Mozilla/5.0', referer: 'https://stock.naver.com/' };
          const urls = [
            'https://stock.naver.com/api/coin/rank/UPBIT?sortType=top&page=1&pageSize=5',
            'https://stock.naver.com/api/autocomplete/search/autoComplete?query=BTC&target=coin',
            'https://stock.naver.com/api/coin/profile/BTC',
          ];
          for (const url of urls) {
            const response = await fetch(url, { headers });
            const text = await response.text();
            console.log('CRYPTO_API', response.status, url, text.slice(0, 12000));
          }

          const pageUrl = 'https://stock.naver.com/market/crypto/ranking/top?exchangeType=UPBIT';
          const page = await fetch(pageUrl, { headers });
          const html = await page.text();
          const scripts = [...html.matchAll(/<script[^>]+src="([^"]+)"/g)]
            .map(match => new URL(match[1], pageUrl).href);
          console.log('CRYPTO_PAGE_SCRIPTS', scripts.length);
          const tokens = ['thumbnailItemCode', 'cryptoLogo', 'coinLogo', 'logo/coin', 'logo/crypto', 'static.upbit', 'nfTicker', 'imageUrl', 'iconUrl'];
          for (const script of scripts) {
            try {
              const js = await (await fetch(script, { headers })).text();
              const hits = [];
              for (const token of tokens) {
                let index = js.indexOf(token);
                if (index >= 0) hits.push(token + ': ' + js.slice(Math.max(0, index - 500), index + 1200));
              }
              if (hits.length) console.log('CRYPTO_JS_MATCH', script, hits.join('\n---\n').slice(0, 16000));
            } catch {}
          }
          NODE
