name: Fix foreign ETF Reuters contract docs

on:
  push:
    branches:
      - refactor/naver-market-data
    paths:
      - .github/workflows/fix-etf-reuters-contract.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/naver-market-data

      - name: Update docs and regression guard
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          old = '미국 ETF 목록은 `/api/stockSecurity/etfs/v2/foreign`의 `tradingValue desc` 계약을 사용하고, 구성종목은 Reuters 코드가 아니라 Naver가 요구하는 ETF ticker를 사용합니다. 국내 ETF 목록은 `/api/stockSecurity/etfs/v2/domestic`의 `listingType=tradingValueDesc` 계약을 사용합니다.'
          new = '미국 ETF 목록은 `/api/stockSecurity/etfs/v2/foreign`의 `tradingValue desc` 계약을 사용하고, 구성종목은 `/api/stockSecurity/etfs/v2/foreign/{reutersCode}/composition`처럼 Reuters 코드를 사용합니다. 2026-09-16 live smoke에서 `QQQ` ticker-only 경로는 404, `QQQ.O` Reuters 경로는 200으로 확인했습니다. 국내 ETF 목록은 `/api/stockSecurity/etfs/v2/domestic`의 `listingType=tradingValueDesc` 계약을 사용합니다.'
          if old not in text:
              raise SystemExit('README foreign ETF sentence not found')
          readme.write_text(text.replace(old, new))

          validator = Path('scripts/validate-naver-migration.mjs')
          text = validator.read_text()
          anchor = '''if (!marketInsights.includes('buildNaverPath("/api/stockSecurity/etfs/v2/foreign"') || !marketInsights.includes('sortType: "tradingValue"') || !marketInsights.includes('sortDirection: "desc"')) {\n  failures.push("foreign ETF list must use the verified Naver v2 ETF contract");\n}\n'''
          replacement = anchor + '''if (!marketInsights.includes('case "foreign-etf-components"') || !marketInsights.includes('const code = await resolveForeignCode(params.symbol ?? params.code, params.exchange);') || marketInsights.includes("foreignEtfTicker")) {\n  failures.push("foreign ETF composition must resolve and preserve the verified Naver Reuters code");\n}\n'''
          if anchor not in text:
              raise SystemExit('migration validator ETF anchor not found')
          validator.write_text(text.replace(anchor, replacement))
          PY

      - name: Commit documentation and guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/validate-naver-migration.mjs
          git commit -m "Guard foreign ETF Reuters composition contract"
          git push origin HEAD:refactor/naver-market-data
