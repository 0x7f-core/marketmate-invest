name: Apply market session UI fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-market-session-ui-fix.yml
      - scripts/apply-market-session-ui-fix.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: node scripts/apply-market-session-ui-fix.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/trading-dashboard.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Keep market session state when switching symbols"
          git push origin HEAD:main
