name: One-time mobile top nav removal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicated mobile top navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          dashboard = Path('app/trading-dashboard.tsx')
          text = dashboard.read_text()
          marker = '<header className="np-mobile-header">'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('mobile header not found')
          end = text.find('</header>', start)
          if end < 0:
              raise SystemExit('mobile header end not found')
          end += len('</header>')
          header = text[start:end]
          patched, count = re.subn(r'<nav>\{\[\["home","마켓"\].*?</nav>', '', header, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'mobile top nav block replacement count={count}')
          dashboard.write_text(text[:start] + patched + text[end:])

          smoke = Path('scripts/validate-browser-runtime.mjs')
          text = smoke.read_text()
          old = "assert(mobileMetrics.topNavButtons === 7 && mobileMetrics.bottomNavButtons === 5, `Unexpected mobile nav counts: ${JSON.stringify(mobileMetrics)}`);"
          new = "assert(mobileMetrics.topNavButtons === 0 && mobileMetrics.bottomNavButtons === 5, `Unexpected mobile nav counts: ${JSON.stringify(mobileMetrics)}`);"
          if old not in text:
              raise SystemExit('mobile nav smoke assertion not found')
          smoke.write_text(text.replace(old, new, 1))
          PY
      - name: Commit mobile navigation cleanup
        run: |
          rm .github/workflows/remove-mobile-top-nav-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/trading-dashboard.tsx scripts/validate-browser-runtime.mjs .github/workflows/remove-mobile-top-nav-once.yml
          git commit -m "ui: remove duplicate mobile top navigation"
          git push
