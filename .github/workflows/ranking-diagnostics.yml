name: Ranking diagnostics

on:
  push:
    paths:
      - .github/workflows/ranking-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe NXT ranking fallback
        shell: bash
        run: |
          for order in up down marketSum quantTop; do
            echo "===== NXT orderType=$order ====="
            url="https://stock.naver.com/api/domestic/market/stock/default?tradeType=NXT&marketType=ALL&orderType=$order&startIdx=0&pageSize=3"
            status=$(curl -sS --max-time 15 -o /tmp/b -w '%{http_code}' -H 'accept: application/json, text/plain, */*' -H 'referer: https://stock.naver.com/' -A 'Mozilla/5.0 MarketMate-Ranking-Diagnostic/1.0' "$url" || true)
            echo "HTTP $status"
            head -c 3500 /tmp/b || true
            echo
          done
